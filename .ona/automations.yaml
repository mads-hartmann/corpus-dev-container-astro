tasks:
  installDeps:
    name: Install dependencies
    description: Install npm dependencies for the Astro project.
    command: |
      npm ci
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    description: Build the Astro site to ./dist.
    command: |
      npm run build
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  dev-server:
    name: Astro dev server
    description: Run the Astro development server.
    commands:
      start: |
        ona environment port open 4321 --admission creator_only --name dev-server
        npm run dev -- --host
      ready: |
        curl -sf http://localhost:4321
