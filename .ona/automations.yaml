tasks:
  installDeps:
    name: Install dependencies
    description: Install npm dependencies for the Astro project.
    command: |
      npm ci
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    description: Build the production site to ./dist/.
    command: |
      npm run build
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  dev-server:
    name: Astro Dev Server
    description: Run the Astro dev server on port 4321.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 4321 --dont-wait --admission creator_only --name "Astro Dev Server"
        export ALLOWED_HOSTS="$(ona environment port get 4321 -f URL | cut -c 9-)"
        npm run dev -- --host 0.0.0.0 --port 4321
      ready: |
        curl -sf http://localhost:4321
