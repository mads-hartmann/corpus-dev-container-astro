tasks:
  install-dependencies:
    name: Install dependencies
    command: npm ci
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    command: npm run build
    dependsOn:
      - install-dependencies
    triggeredBy:
      - manual

services:
  astro-dev:
    name: Astro dev server
    commands:
      start: |
        gitpod environment port open 4321 --admission creator_only --name "Astro dev server" --protocol http
        forwarded_host="$(gitpod environment port get 4321 -f URL | sed -E 's#^https?://##; s#/$##')"
        npm run dev -- --host 0.0.0.0 --allowed-hosts "$forwarded_host"
      ready: curl --fail --silent http://localhost:4321/ > /dev/null
    triggeredBy:
      - manual
      - postEnvironmentStart
