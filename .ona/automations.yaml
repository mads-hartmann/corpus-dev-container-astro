tasks:
  installDeps:
    name: Install dependencies
    description: Install npm dependencies for the Astro project.
    command: |
      npm ci
    triggeredBy:
      - manual
      - postDevcontainerStart
      - prebuild

  build:
    name: Build
    description: Build the production site to ./dist/.
    command: |
      npm run build
    triggeredBy:
      - manual
    dependsOn:
      - installDeps

services:
  dev-server:
    name: Dev Server
    description: Run the Astro dev server.
    triggeredBy:
      - manual
      - postEnvironmentStart
    commands:
      start: |
        ona environment port open 4321 --dont-wait --admission creator_only --name "Dev Server"
        # --host 0.0.0.0 makes the forwarded port reachable; --allowed-hosts (no value)
        # tells Vite to accept any Host header so Ona's exposed-port hostname works.
        # Safe here: this dev server is private to the environment creator.
        node_modules/.bin/astro dev --host 0.0.0.0 --port 4321 --allowed-hosts
      ready: |
        curl -sf http://localhost:4321
